[package]
name = "cullwise"
version = "1.0.0"
description = "Cullwise — offline street photography grading & sequencing"
authors = ["Cullwise"]
edition = "2021"

[lib]
name = "cullwise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cullwise"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = ["devtools"] }
tauri-plugin-shell  = { version = "2" }
tauri-plugin-dialog = { version = "2" }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
ureq           = "2"
reqwest        = { version = "0.12", features = ["json"] }

[profile.release]
panic   = "abort"
codegen-units = 1
lto     = true
opt-level = "s"
strip   = true
