name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: Python — test suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        # windows-latest matches the development platform: several tests
        # exercise Windows-specific behaviour (win_job, path semantics).
        run: python -m pytest tests -q --no-header

  python:
    name: Python — lint + security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff safety

      - name: Lint (ruff)
        run: ruff check src/ server.py

      - name: Undefined-name sweep (F821/F811)
        # The 2026-09 '_p is not defined' class: a progress callback defined
        # as `p` but called as `_p` shipped to users because nothing ran this
        # rule set over routers/ (the split's newest code).
        run: ruff check src/ routers/ --select F821,F811 --no-cache

      - name: Encoding integrity
        # The 2026-09 encoding incidents: cp1252 saves corrupted source
        # silently; BOMs broke ast.parse()-based tests.
        run: python scripts/check_encoding.py

      - name: Vulnerability scan (safety)
        run: safety check -r requirements.txt --short-report

  rust:
    name: Rust — clippy + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Install cargo-audit
        run: cargo install cargo-audit --quiet

      - name: Clippy
        working-directory: frontend/src-tauri
        run: cargo clippy -- -D warnings

      - name: Cargo audit
        working-directory: frontend/src-tauri
        run: cargo audit

  frontend:
    name: Frontend — type-check + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (lint:tokens + lint:tdz + vitest + tsc + vite)
        # The full gate, not just tsc: lint:tokens rejects class names that
        # resolve to nothing (the py-0.5 class), lint:tdz rejects forward
        # references in hook deps, and the build catches encoding-damaged
        # string literals that type-check fine but render garbage.
        working-directory: frontend
        run: npm run build

      - name: NPM audit
        working-directory: frontend
        run: npm audit --audit-level=high
