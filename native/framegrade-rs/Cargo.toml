[package]
name = "framegrade-rs"
version = "0.1.0"
edition = "2021"
description = "FrameGrade native orchestrator — Phase 2 Rust backend core"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

[profile.release]
opt-level = 2
lto = true
